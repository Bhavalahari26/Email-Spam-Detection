{% extends "base.html" %}
{% block content %}
<div class="hero">
  <h1>SMART Spam Detection</h1>
  <p id="typewriter"></p>
  <a href="/login" class="btn">Get Started</a>
</div>

<script>
const textArray = [
  "AI Powered",
  "Adversarially Robust",
  "Reinforcement Enhanced",
  "Future of Email Security"
];
let i = 0, j = 0, currentText = "", isDeleting = false;

function type() {
  if (i < textArray.length) {
    if (!isDeleting && j <= textArray[i].length) {
      currentText = textArray[i].substring(0, j++);
    } else if (isDeleting && j >= 0) {
      currentText = textArray[i].substring(0, j--);
    }
    document.getElementById("typewriter").innerHTML = currentText;
    if (j === textArray[i].length) { isDeleting = true; setTimeout(type, 1000); return; }
    else if (j < 0) { isDeleting = false; i++; if (i >= textArray.length) i = 0; }
  }
  setTimeout(type, isDeleting ? 50 : 120);
}
document.addEventListener("DOMContentLoaded", type);
</script>
{% endblock %}
